# Runs the automatic tests (tests/*.spec.js) on every change pushed to GitHub.
# A red ✗ next to a commit means something the teacher relies on broke —
# don't merge it into main until it's green ✓.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    # Ubuntu 24.04, not ubuntu-latest: since Nov 2026 "latest" is 26.04, where Playwright 1.56.1 can't install its
    # browser ("Playwright does not support chromium on ubuntu26.04-x64") — every run failed before any test.
    # Move to a newer image only together with a Playwright version that supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Keep the report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: playwright-report/
          retention-days: 14
