<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercise</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; background: #F5F5FA; color: #14151F;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  .box { max-width: 420px; }
  .spin { width: 42px; height: 42px; margin: 0 auto 16px; border-radius: 50%; border: 4px solid #D9D9EE; border-top-color: #5B54E8; animation: s 0.9s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  h1 { font-size: 1.15rem; margin: 0 0 8px; }
  p { color: #5A5D72; line-height: 1.5; margin: 0; }
</style>
</head>
<body>
<!-- Opens an exercise the teacher's app put online (a pronunciation exercise:
     a phone only lets a page use the microphone when it comes from a web
     address like this one, not from a file opened in a chat).
     play.html?x=<exercise id> -->
<div class="box" id="box"><div class="spin"></div><h1>Opening the exercise…</h1><p>One moment.</p></div>
<script>
(function () {
  var box = document.getElementById('box');
  function fail(title, text) { box.innerHTML = '<h1>' + title + '</h1><p>' + text + '</p>'; }
  var id = new URLSearchParams(location.search).get('x') || '';
  if (!/^[A-Za-z0-9_-]{4,80}$/.test(id)) { fail('This link is incomplete', 'Ask your teacher to send the exercise link again.'); return; }
  var url = 'https://firestore.googleapis.com/v1/projects/teachers-assistant-app-ccd1a/databases/(default)/documents/results/play-' +
    encodeURIComponent(id) + '?key=AIzaSyCefg2YghdSneABh0ZOUu3-snO4soVw0lA';
  fetch(url).then(function (r) {
    if (r.status === 404) throw new Error('missing');
    if (!r.ok) throw new Error('http ' + r.status);
    return r.json();
  }).then(function (d) {
    var f = d && d.fields;
    var html = f && f.type && f.type.stringValue === 'TA_SYNC:PLAY' && f.data && f.data.stringValue;
    if (!html || html.indexOf('<html') === -1) throw new Error('missing');
    // the exercise replaces this page, and runs here at this web address
    document.open();
    document.write(html);
    document.close();
  }).catch(function (e) {
    if (String(e && e.message) === 'missing') fail('This exercise isn’t online', 'Ask your teacher to send it again.');
    else fail('Couldn’t open the exercise', 'Check your internet connection, then reload this page.');
  });
})();
</script>
</body>
</html>
